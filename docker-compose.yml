services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: xingliu
      POSTGRES_USER: xingliu
      POSTGRES_PASSWORD: xingliu
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U xingliu -d xingliu"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  postgres-runtime-role:
    image: postgres:17-alpine
    environment:
      PGHOST: postgres
      PGDATABASE: xingliu
      PGUSER: xingliu
      PGPASSWORD: xingliu
      POSTGRES_RUNTIME_USER: ${POSTGRES_RUNTIME_USER:-xingliu_runtime}
      POSTGRES_RUNTIME_PASSWORD: ${POSTGRES_RUNTIME_PASSWORD:-xingliu-runtime}
    volumes:
      - ./postgres/ensure-runtime-role.sql:/bootstrap/ensure-runtime-role.sql:ro
    command: >-
      sh -c "psql -v ON_ERROR_STOP=1
      -v runtime_user=$${POSTGRES_RUNTIME_USER}
      -v runtime_password=$${POSTGRES_RUNTIME_PASSWORD}
      -f /bootstrap/ensure-runtime-role.sql"
    depends_on:
      postgres:
        condition: service_healthy

  minio:
    image: minio/minio:RELEASE.2025-07-23T15-54-02Z
    profiles: ["object-storage"]
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-xingliu-minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-xingliu-minio-secret}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio-init:
    image: minio/mc:RELEASE.2025-07-21T05-28-08Z
    profiles: ["object-storage"]
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >-
      /bin/sh -c "mc alias set local http://minio:9000
      $${MINIO_ROOT_USER:-xingliu-minio} $${MINIO_ROOT_PASSWORD:-xingliu-minio-secret}
      && mc mb --ignore-existing local/$${S3_BUCKET:-xingliu-assets}"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-xingliu-minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-xingliu-minio-secret}
      S3_BUCKET: ${S3_BUCKET:-xingliu-assets}

  migrate:
    build: ./backend
    command: alembic upgrade head
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
      DATABASE_URL: postgresql+asyncpg://xingliu_runtime:${POSTGRES_RUNTIME_PASSWORD:-xingliu-runtime}@postgres:5432/xingliu
      MIGRATION_DATABASE_URL: postgresql+asyncpg://xingliu:xingliu@postgres:5432/xingliu
    depends_on:
      postgres-runtime-role:
        condition: service_completed_successfully

  api:
    build: ./backend
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
      CORS_ORIGINS: http://localhost:3000
      DATABASE_URL: postgresql+asyncpg://xingliu_runtime:${POSTGRES_RUNTIME_PASSWORD:-xingliu-runtime}@postgres:5432/xingliu
      REDIS_URL: redis://redis:6379/0
      AUTH_MODE: ${AUTH_MODE:-development}
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      OIDC_AUDIENCE: ${OIDC_AUDIENCE:-}
      OIDC_JWKS_URL: ${OIDC_JWKS_URL:-}
      OIDC_ALGORITHMS: ${OIDC_ALGORITHMS:-RS256}
      SERVICE_PRINCIPAL_PEPPER: ${SERVICE_PRINCIPAL_PEPPER:-}
      ASSET_STORAGE_BACKEND: ${ASSET_STORAGE_BACKEND:-local}
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-false}
      RUNTIME_CONSUMER_MAX_ATTEMPTS: ${RUNTIME_CONSUMER_MAX_ATTEMPTS:-8}
      RUNTIME_CONSUMER_RETRY_BASE_SECONDS: ${RUNTIME_CONSUMER_RETRY_BASE_SECONDS:-5}
      RUNTIME_CONSUMER_LEASE_SECONDS: ${RUNTIME_CONSUMER_LEASE_SECONDS:-180}
      EVALUATOR_MAX_ATTEMPTS: ${EVALUATOR_MAX_ATTEMPTS:-3}
      EVALUATOR_RETRY_BASE_SECONDS: ${EVALUATOR_RETRY_BASE_SECONDS:-10}
      AVATAR_PROVIDER_ORDER: ${AVATAR_PROVIDER_ORDER:-duix,opentalking}
      AVATAR_ROUTE_POLICY_VERSION: ${AVATAR_ROUTE_POLICY_VERSION:-avatar-route-v1}
      DUIX_BASE_URL: ${DUIX_BASE_URL:-http://host.docker.internal:8383/easy}
      DUIX_SHARED_DATA_ROOT: /duix-data
      DUIX_CONTAINER_DATA_ROOT: /code/data
      DUIX_MOCK: ${DUIX_MOCK:-false}
      OPENTALKING_BASE_URL: ${OPENTALKING_BASE_URL:-}
      OPENTALKING_API_KEY: ${OPENTALKING_API_KEY:-}
      OPENTALKING_RENDER_ENABLED: ${OPENTALKING_RENDER_ENABLED:-false}
      MODEL_GATEWAY_BASE_URL: ${MODEL_GATEWAY_BASE_URL:-}
      MODEL_GATEWAY_API_KEY: ${MODEL_GATEWAY_API_KEY:-}
      MODEL_GATEWAY_DEFAULT_MODEL: ${MODEL_GATEWAY_DEFAULT_MODEL:-}
      MODEL_GATEWAY_TIMEOUT_SECONDS: ${MODEL_GATEWAY_TIMEOUT_SECONDS:-120}
      AI_PROVIDER_SECRET_KEY: ${AI_PROVIDER_SECRET_KEY:-}
      AGENT_OPERATION_LEASE_SECONDS: ${AGENT_OPERATION_LEASE_SECONDS:-180}
      AGENT_OPERATION_RETRY_BASE_SECONDS: ${AGENT_OPERATION_RETRY_BASE_SECONDS:-10}
      PLANNING_TIMEOUT_SECONDS: ${PLANNING_TIMEOUT_SECONDS:-180}
      PLANNING_MAX_ATTEMPTS: ${PLANNING_MAX_ATTEMPTS:-3}
      CAPABILITY_EXTENSION_MODULES: ${CAPABILITY_EXTENSION_MODULES:-}
      EVALUATOR_EXTENSION_MODULES: ${EVALUATOR_EXTENSION_MODULES:-}
      WORKFLOW_EXTENSION_MODULES: ${WORKFLOW_EXTENSION_MODULES:-}
      PROVIDER_EXTENSION_MODULES: ${PROVIDER_EXTENSION_MODULES:-}
      EXECUTOR_EXTENSION_MODULES: ${EXECUTOR_EXTENSION_MODULES:-}
      PRODUCT_EXTENSION_MODULES: ${PRODUCT_EXTENSION_MODULES:-}
    ports:
      - "8000:8000"
    volumes:
      - type: bind
        source: ${DUIX_HOST_DATA_ROOT:-./data/duix}
        target: /duix-data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10

  worker:
    build: ./backend
    command: python -m app.worker
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
      DATABASE_URL: postgresql+asyncpg://xingliu_runtime:${POSTGRES_RUNTIME_PASSWORD:-xingliu-runtime}@postgres:5432/xingliu
      REDIS_URL: redis://redis:6379/0
      AUTH_MODE: ${AUTH_MODE:-development}
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      OIDC_AUDIENCE: ${OIDC_AUDIENCE:-}
      OIDC_JWKS_URL: ${OIDC_JWKS_URL:-}
      OIDC_ALGORITHMS: ${OIDC_ALGORITHMS:-RS256}
      SERVICE_PRINCIPAL_PEPPER: ${SERVICE_PRINCIPAL_PEPPER:-}
      ASSET_STORAGE_BACKEND: ${ASSET_STORAGE_BACKEND:-local}
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-false}
      RUNTIME_CONSUMER_MAX_ATTEMPTS: ${RUNTIME_CONSUMER_MAX_ATTEMPTS:-8}
      RUNTIME_CONSUMER_RETRY_BASE_SECONDS: ${RUNTIME_CONSUMER_RETRY_BASE_SECONDS:-5}
      RUNTIME_CONSUMER_LEASE_SECONDS: ${RUNTIME_CONSUMER_LEASE_SECONDS:-180}
      EVALUATOR_MAX_ATTEMPTS: ${EVALUATOR_MAX_ATTEMPTS:-3}
      EVALUATOR_RETRY_BASE_SECONDS: ${EVALUATOR_RETRY_BASE_SECONDS:-10}
      AVATAR_PROVIDER_ORDER: ${AVATAR_PROVIDER_ORDER:-duix,opentalking}
      AVATAR_ROUTE_POLICY_VERSION: ${AVATAR_ROUTE_POLICY_VERSION:-avatar-route-v1}
      DUIX_BASE_URL: ${DUIX_BASE_URL:-http://host.docker.internal:8383/easy}
      DUIX_SHARED_DATA_ROOT: /duix-data
      DUIX_CONTAINER_DATA_ROOT: /code/data
      DUIX_MOCK: ${DUIX_MOCK:-false}
      OPENTALKING_BASE_URL: ${OPENTALKING_BASE_URL:-}
      OPENTALKING_API_KEY: ${OPENTALKING_API_KEY:-}
      OPENTALKING_RENDER_ENABLED: ${OPENTALKING_RENDER_ENABLED:-false}
      MODEL_GATEWAY_BASE_URL: ${MODEL_GATEWAY_BASE_URL:-}
      MODEL_GATEWAY_API_KEY: ${MODEL_GATEWAY_API_KEY:-}
      MODEL_GATEWAY_DEFAULT_MODEL: ${MODEL_GATEWAY_DEFAULT_MODEL:-}
      MODEL_GATEWAY_TIMEOUT_SECONDS: ${MODEL_GATEWAY_TIMEOUT_SECONDS:-120}
      AI_PROVIDER_SECRET_KEY: ${AI_PROVIDER_SECRET_KEY:-}
      AGENT_OPERATION_LEASE_SECONDS: ${AGENT_OPERATION_LEASE_SECONDS:-180}
      AGENT_OPERATION_RETRY_BASE_SECONDS: ${AGENT_OPERATION_RETRY_BASE_SECONDS:-10}
      PLANNING_TIMEOUT_SECONDS: ${PLANNING_TIMEOUT_SECONDS:-180}
      PLANNING_MAX_ATTEMPTS: ${PLANNING_MAX_ATTEMPTS:-3}
      CAPABILITY_EXTENSION_MODULES: ${CAPABILITY_EXTENSION_MODULES:-}
      EVALUATOR_EXTENSION_MODULES: ${EVALUATOR_EXTENSION_MODULES:-}
      WORKFLOW_EXTENSION_MODULES: ${WORKFLOW_EXTENSION_MODULES:-}
      PROVIDER_EXTENSION_MODULES: ${PROVIDER_EXTENSION_MODULES:-}
      EXECUTOR_EXTENSION_MODULES: ${EXECUTOR_EXTENSION_MODULES:-}
      PRODUCT_EXTENSION_MODULES: ${PRODUCT_EXTENSION_MODULES:-}
    volumes:
      - type: bind
        source: ${DUIX_HOST_DATA_ROOT:-./data/duix}
        target: /duix-data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: .
      args:
        NEXT_PUBLIC_API_BASE_URL: http://localhost:8000/v1
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10

  duix-avatar-gen-video:
    image: guiji2025/duix.avatar
    profiles: ["duix"]
    restart: unless-stopped
    runtime: nvidia
    privileged: true
    environment:
      PYTORCH_CUDA_ALLOC_CONF: max_split_size_mb:512
    volumes:
      - type: bind
        source: ${DUIX_HOST_DATA_ROOT:-./data/duix}
        target: /code/data
    shm_size: 8gb
    ports:
      - "8383:8383"
    command: python /code/app_local.py

volumes:
  postgres_data:
  redis_data:
  minio_data:
